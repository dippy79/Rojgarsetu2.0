services:
  # ---------------------------------------------------------------------------
  # 1. DATABASE & CACHE
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: rojgar-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rojgarsetu}
      
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rojgar-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rojgarsetu}"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  redis:
    image: redis:7-alpine
    container_name: rojgar-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rojgar-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. CORE BACKEND SERVICES
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend_go
      dockerfile: Dockerfile
    container_name: rojgar-backend
    restart: always
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-rojgarsetu-shared-jwt-secret-please-change-2025}
      RATE_LIMIT: "100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rojgar-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  auth-service:
    build:
      context: ./services/auth-java
      dockerfile: Dockerfile
    container_name: rojgar-auth-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rojgarsetu}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      # JWT config - MUST match backend_go exactly for cross-service token validation
      JWT_SECRET: ${JWT_SECRET:-rojgarsetu-shared-jwt-secret-please-change-2025}
      JWT_ISSUER: ${JWT_ISSUER:-rojgarsetu-backend}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-rojgarsetu-api}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rojgar-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # 3. PYTHON AI ENGINE
  # ---------------------------------------------------------------------------
  ai-engine:
    build:
      context: ./services/ai-engine-python
      dockerfile: Dockerfile
    container_name: rojgar-ai-engine
    restart: always
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rojgar-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # 4. GO CRAWLER
  # ---------------------------------------------------------------------------
  crawler:
    build:
      context: ./services/crawler-go
      dockerfile: Dockerfile
    container_name: rojgar-crawler
    restart: always
    ports:
      - "8082:8080"
    environment:
      CHROME_BIN: /usr/bin/chromium-browser
      PORT: 8080
      POSTGRES_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-rojgarsetu}?sslmode=disable
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rojgar-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 5. API GATEWAY & FRONTEND
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: ./services/api-gateway-node
      dockerfile: Dockerfile
    container_name: rojgar-api-gateway
    restart: always
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:8081
      BACKEND_SERVICE_URL: http://backend:8083
      AI_ENGINE_URL: http://ai-engine:8000
      CRAWLER_SERVICE_URL: http://crawler:8080
    depends_on:
      backend:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - rojgar-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rojgar-frontend
    restart: always
    ports:
      - "80:80"
    environment:
      REACT_APP_BACKEND_URL: http://localhost:8083
      REACT_APP_API_URL: http://localhost:8083
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - rojgar-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  rojgar-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
