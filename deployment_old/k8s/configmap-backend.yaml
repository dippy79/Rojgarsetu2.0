apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: rojgarsetu
data:
  ENABLE_TLS: "true"
  RATE_LIMIT: "100"
---
apiVersion: v1
kind: Secret
metadata:
  name: rojgarsetu-secrets
  namespace: rojgarsetu
type: Opaque
# Secrets must be populated separately using:
# kubectl create secret generic rojgarsetu-secrets --from-literal=database_url=$DATABASE_URL --from-literal=jwt_secret=$JWT_SECRET -n rojgarsetu
# Use SealedSecrets or ExternalSecrets operator for prod
