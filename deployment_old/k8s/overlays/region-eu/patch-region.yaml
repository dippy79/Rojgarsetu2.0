apiVersion: apps/v1
$patch: replace
kind: Deployment
metadata:
  name: backend
spec:
  template:
    spec:
      containers:
      - name: backend
        env:
        - name: CRAWLER_REGION
          value: "eu"
        - name: DB_URL_LOCAL
          valueFrom:
            secretKeyRef:
              name: rojgarsetu-secrets-eu
              key: ro_database_url
      nodeSelector:
        topology.kubernetes.io/region: europe-west1
---
apiVersion: apps/v1
$patch: replace
kind: Deployment
metadata:
  name: crawler
spec:
  template:
    spec:
      containers:
      - name: crawler
        env:
        - name: CRAWLER_REGION
          value: "eu"
---
apiVersion: networking.k8s.io/v1
$patch: replace
kind: Ingress
metadata:
  name: rojgarsetu-ingress
spec:
  rules:
  - host: eu.rojgarsetu.com
  tls:
  - hosts:
    - eu.rojgarsetu.com
    secretName: eu-rojgarsetu-tls
