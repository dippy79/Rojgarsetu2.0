name: rojgarsetu
description: RojgarSetu 2.0 - Job Portal Mobile App
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  flutter_bloc: ^9.1.1
  
  # Networking
  dio: ^5.4.0
  http: ^1.1.2
  
  # Local Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  
  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0
  
  # Navigation
  go_router: ^17.1.0
  
  # Utils
  intl: ^0.20.2
  url_launcher: ^6.2.4
  flutter_secure_storage: ^10.0.0
  
  # Push Notifications
  firebase_messaging: ^16.1.2
  firebase_core: ^4.5.0
  
  # Forms
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0
  bloc: ^9.2.0
  equatable: ^2.0.5
  get_it: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/

