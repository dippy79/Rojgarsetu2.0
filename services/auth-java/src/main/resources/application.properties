# Server binding (explicit IPv4)
server.address=0.0.0.0
server.port=8081

# JWT configuration (shared with backend_go - see JwtService.java for the
# interoperability contract: same HS256 secret, issuer, audience, and claims).
jwt.secret=${JWT_SECRET:}
jwt.issuer=${JWT_ISSUER:rojgarsetu2-backend}
jwt.audience=${JWT_AUDIENCE:rojgarsetu2-api}
jwt.expiry-seconds=${JWT_EXPIRY_SECONDS:86400}

# Database Configuration (via environment variables in Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rojgarsetu2}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Actuator - Health endpoint for container healthchecks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# Logging
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.com.rojgarsetu2=DEBUG
