version: '3.8'

services:
  # ... inheriting from main compose, but adding production overrides
  
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  backend:
    extends:
      file: docker-compose.yml
      service: backend
    environment:
      ENVIRONMENT: production
    volumes:
      - ./logs/backend:/app/logs

  api-gateway:
    extends:
      file: docker-compose.yml
      service: api-gateway
    volumes:
      - ./logs/gateway:/app/logs

  # CERTBOT for SSL
  certbot:
    image: certbot/certbot
    volumes:
      - ./certs/etc:/etc/letsencrypt
      - ./certs/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

  # Production Nginx (Replacing direct port mapping if needed)
  nginx:
    image: nginx:alpine
    container_name: rojgar-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/vps/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/etc:/etc/letsencrypt:ro
      - ./certs/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - api-gateway
    networks:
      - rojgar-network

volumes:
  postgres_prod_data:
  redis_data:

networks:
  rojgar-network:
    driver: bridge
