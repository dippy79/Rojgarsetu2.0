name: RojgarSetu Production CI/CD

on:
  push:
    branches: [ master ]

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.11'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Go test backend
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
        working-directory: backend_go
        run: |
          go mod tidy
          go test ./... -v -cover

      - name: Go test integration
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
        working-directory: backend_go
        run: |
          go mod tidy
          go test ./tests/... -v -cover

      - name: Go test crawler
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
        working-directory: services/crawler-go
        run: |
          go mod tidy
          go test ./...

      - name: Node test frontend
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
        working-directory: frontend
        run: npm ci && npm test

      - name: Python test AI engine
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
        working-directory: services/ai-engine-python
        run: |
          pip install -r requirements.txt
          pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build --no-cache

  security:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  deploy:
    needs: [test, build, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push images
        run: |
          docker compose build
          docker compose push

      - name: Deploy to production
        run: |
          echo "Deploy to production server would happen here"
          echo "This would typically involve:"
          echo "- SSH to production server"
          echo "- docker compose pull"
          echo "- docker compose up -d"
          echo "- Health checks against production endpoints"