name: RojgarSetu Production CI/CD

on:
  push:
    branches: [ master ]

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go test backend
        working-directory: backend_go
        run: |
          go mod tidy
          go test ./... -v -cover 2>&1 || true

      - name: Go test integration
        working-directory: backend_go
        run: |
          go mod tidy
          go test ./tests/... -v -cover 2>&1 || true

      - name: Go test crawler
        working-directory: services/crawler-go
        run: |
          go mod tidy
          go test ./... 2>&1 || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Node test frontend
        working-directory: frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          npm install --legacy-peer-deps
          CI=false npm run type-check 2>&1 || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Python smoke test AI engine
        working-directory: services/ai-engine-python
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/rojgarsetu2"
          GEMINI_API_KEY: "dummy_gemini_api_key"
          API_KEY: "dummy_internal_api_key"
        run: |
          pip install -r requirements.txt
          python -c "from recommender.service import app; assert app.title == 'RojgarSetu AI Engine'"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build --no-cache

  security:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: services/auth-java/pom.xml

      - name: Build Java Artifact
        working-directory: services/auth-java
        run: mvn clean package -DskipTests --batch-mode

      - name: Run Trivy vulnerability scanner
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs . \
            --scanners vuln \
            --skip-dirs services/auth-java \
            --skip-dirs node_modules \
            --skip-dirs frontend/.next \
            --skip-dirs .git \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output trivy-results.sarif \
            --exit-code 0 \
            --timeout 10m
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  deploy:
    needs: [test, build, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push images
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        run: |
          docker compose build
          # docker compose push # Disabled until image names are correctly tagged with registry
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Deploy to production
        run: |
          echo "Deploy to production server would happen here"
          echo "This would typically involve:"
          echo "- SSH to production server"
          echo "- docker compose pull"
          echo "- docker compose up -d"
          echo "- Health checks against production endpoints"
