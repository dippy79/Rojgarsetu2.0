name: RojgarSetu CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Mod tidy + build
        working-directory: backend_go
        run: |
          go mod tidy
          go build ./...
      - name: Test
        working-directory: backend_go
        run: go test ./... -v --timeout=60s || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install + build
        working-directory: frontend
        run: |
          npm install
          npm run build

  ai-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install + test
        working-directory: services/ai-engine-python
        run: |
          pip install -r requirements.txt
          python -m pytest tests/ -v || true
