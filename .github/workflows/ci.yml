name: CI/CD Production

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend:
    name: Go build &amp; vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: &#x27;1.24&#x27;
          cache: true
      - run: go mod download
      - run: go vet ./...
      - run: go build ./...

  flutter-analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: &#x27;3.24.0&#x27;
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  flutter-release:
    name: Build Flutter Release APK
    if: github.ref == &#x27;refs/heads/main&#x27;
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: &#x27;3.24.0&#x27;
          cache: true
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
        env:
          API_BASE_URL: https://api.yourdomain.com
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

  deploy-vps:
    name: Deploy to VPS
    if: github.ref == &#x27;refs/heads/main&#x27;
    needs: [backend, flutter-analyze, flutter-release]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/rojgarsetu || (echo "Repo not found, clone first" &amp;&amp; exit 1)
            git pull origin main
            ./deploy.sh
            curl -f https://${{ secrets.VPS_HOST }}/health || curl -f http://${{ secrets.VPS_HOST }}/health

# Required GitHub Secrets:
# VPS_HOST (e.g. your.vps.ip)
# VPS_USER (ubuntu/root)
# VPS_SSH_KEY (private key)

