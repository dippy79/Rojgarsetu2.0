      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Filter by notification type
        in: query
        name: notification_type
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get user notification logs
      tags:
      - notifications
    post:
      description: Create a new notification log
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      - description: Notification request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateNotificationRequest'
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      summary: Create notification log
      tags:
      - notifications
  /api/v1/videos:
