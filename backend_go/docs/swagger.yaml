  /api/v1/priv-jobs:
    get:
      description: Retrieve paginated list of private jobs with optional filters
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Filter by company
        in: query
        name: company
        type: string
      - description: Filter by location
        in: query
        name: location
        type: string
      - description: Filter by source
        in: query
        name: source
        type: string
      - description: Filter by job type
        in: query
        name: job_type
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get private jobs
      tags:
      - jobs
  /api/v1/search:
    get:
      description: Full-text search across government and private jobs
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      - default: all
        description: Job type (gov, private, all)
        in: query
        name: type
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Search jobs
      tags:
      - search
  /api/v1/trades:
    get:
      description: Retrieve paginated list of job trades with optional filters
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Filter by category ID
        in: query
        name: category_id
        type: string
      - description: Filter by demand level
        in: query
        name: demand_level
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get job trades
      tags:
      - trades
  /api/v1/trades/{id}:
    get:
      description: Retrieve a specific job trade by ID
      parameters:
      - description: Job trade ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get job trade by ID
      tags:
      - trades
  /api/v1/users/{user_id}/enrollments:
    get:
      description: Retrieve paginated list of user enrollments with optional filters
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Filter by status
        in: query
        name: status
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get user enrollments
      tags:
      - enrollments
    post:
      description: Create a new user enrollment
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      - description: Enrollment request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateEnrollmentRequest'
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      summary: Create user enrollment
      tags:
      - enrollments
  /api/v1/users/{user_id}/notifications:
