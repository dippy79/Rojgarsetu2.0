  /api/v1/notifications/{id}:
    get:
      description: Retrieve a specific notification log by ID
      parameters:
      - description: Notification log ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get notification log by ID
      tags:
      - notifications
  /api/v1/notifications/{id}/clicked:
