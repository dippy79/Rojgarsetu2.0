definitions:
  handlers.CreateEnrollmentRequest:
    properties:
      expires_at:
        format: date-time
        type: string
      metadata:
        additionalProperties: true
        type: object
      trade_id:
        format: uuid
        type: string
    required:
    - expires_at
    - trade_id
    type: object
  handlers.CreateNotificationRequest:
    properties:
      channel:
        type: string
      enrollment_id:
        type: string
      message:
        type: string
      notification_type:
        type: string
      payload:
        additionalProperties: true
        type: object
      title:
        type: string
    required:
    - channel
    - message
    - notification_type
    - title
    type: object
  handlers.UpdateEnrollmentRequest:
    properties:
      completed_at:
        format: date-time
        type: string
      expires_at:
        format: date-time
        type: string
      metadata:
        additionalProperties: true
        type: object
      progress_pct:
        format: int32
        type: integer
      status:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/categories:
    get:
      description: Retrieve list of job categories
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get job categories
      tags:
      - categories
  /api/v1/categories/{category_id}/trades:
    get:
      description: Retrieve job trades for a specific category
      parameters:
      - description: Category ID
        in: path
        name: category_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get job trades by category
      tags:
      - trades
  /api/v1/categories/{category_id}/trades/{slug}:
    get:
      description: Retrieve a specific job trade by slug and category
      parameters:
      - description: Job trade slug
        in: path
        name: slug
        required: true
        type: string
      - description: Category ID
        in: path
        name: category_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get job trade by slug
      tags:
      - trades
  /api/v1/categories/{id}:
    get:
      description: Retrieve a specific job category by ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get job category by ID
      tags:
      - categories
  /api/v1/categories/slug/{slug}:
    get:
      description: Retrieve a specific job category by slug
      parameters:
      - description: Category slug
        in: path
        name: slug
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get job category by slug
      tags:
      - categories
  /api/v1/courses:
    get:
      description: Retrieve paginated list of courses with optional filters
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Filter by provider
        in: query
        name: provider
        type: string
      - description: Filter by mode
        in: query
        name: mode
        type: string
      - description: Filter by level
        in: query
        name: level
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get courses
      tags:
      - courses
  /api/v1/courses/providers:
    get:
      description: Retrieve list of course providers
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get course providers
      tags:
      - courses
  /api/v1/enrollments/{id}:
    get:
      description: Retrieve a specific user enrollment by ID
      parameters:
      - description: Enrollment ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get user enrollment by ID
      tags:
      - enrollments
    put:
      description: Update an existing user enrollment
      parameters:
      - description: Enrollment ID
        in: path
        name: id
        required: true
        type: string
      - description: Update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateEnrollmentRequest'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Update user enrollment
      tags:
      - enrollments
  /api/v1/enrollments/{id}/cancel:
    post:
      description: Cancel an enrollment
      parameters:
      - description: Enrollment ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Cancel enrollment
      tags:
      - enrollments
  /api/v1/enrollments/{id}/complete:
    post:
      description: Mark an enrollment as completed
      parameters:
      - description: Enrollment ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Complete enrollment
      tags:
      - enrollments
  /api/v1/enrollments/{id}/progress:
    put:
      description: Update the progress percentage of an enrollment
      parameters:
      - description: Enrollment ID
        in: path
        name: id
        required: true
        type: string
      - description: Progress request
        in: body
        name: request
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Update enrollment progress
      tags:
      - enrollments
  /api/v1/enrollments/expiring:
    get:
      description: Retrieve enrollments expiring in <= 7 days
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get expiring enrollments
      tags:
      - enrollments
  /api/v1/gov-jobs:
    get:
      description: Retrieve paginated list of government jobs with optional filters
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Filter by department
        in: query
        name: department
        type: string
      - description: Filter by location
        in: query
