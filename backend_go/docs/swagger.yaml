        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Filter by channel
        in: query
        name: channel
        type: string
      - description: Filter by category
        in: query
        name: category
        type: string
      - description: Exclude specific video IDs
        in: query
        name: exclude
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get videos
      tags:
      - videos
  /api/v1/videos/categories:
    get:
