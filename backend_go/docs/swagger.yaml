  /api/v1/videos/channels:
    get:
      description: Retrieve list of video channels
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get video channels
      tags:
      - videos
  /api/v1/ws:
    get:
      description: Establish WebSocket connection for real-time notifications
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
      summary: WebSocket connection for real-time notifications
      tags:
      - websocket
swagger: "2.0"
