 # RojgarSetu 2.0 - Docker Compose
# Production-ready multi-service orchestration

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: rojgar-postgres
    environment:
      POSTGRES_USER: rojgarsetu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rojgarsetu
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
      - ../database/schema_v2.sql:/docker-entrypoint-initdb.d/01_schema_v2.sql:ro
      - ../database/schema_v3.sql:/docker-entrypoint-initdb.d/99_schema_v3.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rojgarsetu -d rojgarsetu"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rojgar-network
    restart: unless-stopped

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: rojgar-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://rojgarsetu:${POSTGRES_PASSWORD}@postgres:5432/rojgarsetu?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rojgar-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: rojgar-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rojgar-network
    restart: unless-stopped

  redis_exporter:
    image: oliver006/redis_exporter:v1.57.0
    container_name: rojgar-redis-exporter
    command: --redis.addr redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rojgar-network
    restart: unless-stopped

  # API Gateway (Node.js)
  api-gateway:
    build:
      context: ../api_gateway_node
      dockerfile: ../deployment/Dockerfile.api-gateway
    container_name: rojgar-api-gateway
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rojgarsetu
      DB_USER: rojgarsetu
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      RATE_LIMIT_WINDOW: 15
      RATE_LIMIT_MAX: 100
      BACKEND_API_URL: http://backend:8083
    ports:
      - "3000:3000"
    volumes:
      - ../deployment/.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rojgar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Backend API (Go)
  backend:
    build:
      context: ../backend_go
      dockerfile: ../deployment/Dockerfile.backend
    container_name: rojgar-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PORT: 8083
      ENABLE_TLS: "true"
      TLS_CERT_PATH: /certs/cert.pem
      TLS_KEY_PATH: /certs/key.pem
      JWT_ISSUER: rojgarsetu-backend
      JWT_AUDIENCE: rojgarsetu-api
      JWT_SECRET: ${JWT_SECRET}
      RATE_LIMIT: "100"
    ports:
      - "8083:8083"
      - "8443:8443"
    volumes:
      - ../backend_go/certs:/certs:ro
      - ../deployment/.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rojgar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Auth Service (Java Spring Boot)
  auth-service:
    build:
      context: ../auth_service_java
      dockerfile: ../deployment/Dockerfile.auth-service
    container_name: rojgar-auth-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rojgarsetu
      SPRING_DATASOURCE_USERNAME: rojgarsetu
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 86400000
    ports:
      - "8081:8081"
    volumes:
      - ../deployment/.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rojgar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Crawler Service (Go)
  crawler-service:
    build:
      context: ../crawler_go
      dockerfile: ../deployment/Dockerfile.crawler
    container_name: rojgar-crawler-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CRAWLER_WORKERS: 5
      CRAWLER_TIMEOUT: 30
      CRAWLER_RETRY_ATTEMPTS: 3
      CRAWLER_PROXY_ENABLED: "false"
      CHROME_FLAGS: "--no-sandbox --disable-dev-shm-usage --disable-gpu"
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rojgar-network
    restart: unless-stopped
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # AI Engine (Python FastAPI)
  ai-engine:
    build:
      context: ../ai_engine_python
      dockerfile: ../deployment/Dockerfile.ai-engine
    container_name: rojgar-ai-engine
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MODEL_PATH: /app/models
      ENVIRONMENT: production
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ai_models:/app/models
    networks:
      - rojgar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Frontend (React/Next.js)
  frontend:
    build:
      context: ../frontend
      dockerfile: ../deployment/Dockerfile.frontend
    container_name: rojgar-frontend
    environment:
      REACT_APP_API_URL: http://api-gateway:3000
      REACT_APP_BACKEND_URL: http://backend:8083
      NODE_ENV: production
    ports:
      - "3001:80"
    depends_on:
      - api-gateway
      - backend
    networks:
      - rojgar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: rojgar-prometheus
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9090:9090"
    networks:
      - rojgar-network
    restart: unless-stopped

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: rojgar-grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SERVER_ROOT_URL: http://localhost:3002
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    networks:
      - rojgar-network
    restart: unless-stopped

networks:
  rojgar-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ai_models:
  prometheus_data:
  grafana_data:

