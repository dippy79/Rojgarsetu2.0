version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rojgar-postgres
    env_file: .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rojgarsetu
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../database/schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
      - ../../database/schema_v2.sql:/docker-entrypoint-initdb.d/01_schema_v2.sql:ro
      - ../../database/schema_v3.sql:/docker-entrypoint-initdb.d/99_schema_v3.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - rojgar-network
    restart: unless-stopped

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: rojgar-postgres-exporter
    env_file: .env
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres:5432/rojgarsetu?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rojgar-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rojgar-redis
    env_file: .env
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rojgar-network
    restart: unless-stopped

  redis_exporter:
    image: oliver006/redis_exporter:v1.57.0
    container_name: rojgar-redis-exporter
    env_file: .env
    command: --redis.addr redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rojgar-network
    restart: unless-stopped

  api-gateway:
    env_file: .env
    build:
      context: ./services/api-gateway-node
      dockerfile: ../../Dockerfile.api-gateway
    container_name: rojgar-api-gateway
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      REDIS_URL: ${REDIS_URL}
      DB_PORT: 5432
      DB_NAME: rojgarsetu
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rojgar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend:
    env_file: .env
    build:
      context: ./services/backend-go
      dockerfile: ../../Dockerfile.backend
    container_name: rojgar-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PORT: 8083
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8083:8083"
    volumes:
      - ../../backend_go/certs:/certs:ro
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rojgar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  auth-service:
    env_file: .env
    build:
      context: ./services/auth-java
      dockerfile: ../../Dockerfile.auth-service
    container_name: rojgar-auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rojgarsetu?sslmode=disable
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8081:8081"
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rojgar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  crawler-service:
    env_file: .env
    build:
      context: ./services/crawler-go
      dockerfile: ../../Dockerfile.crawler
    container_name: rojgar-crawler-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rojgar-network
    restart: unless-stopped
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ai-engine:
    env_file: .env
    build:
      context: ../ai_engine_python
      dockerfile: ../deployment/Dockerfile.ai-engine
    container_name: rojgar-ai-engine
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ai_models:/app/models
    networks:
      - rojgar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    env_file: .env
    build:
      context: ../frontend
      dockerfile: ./Dockerfile.frontend
    container_name: rojgar-frontend
    ports:
      - "3001:80"
    depends_on:
      api-gateway:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - rojgar-network
    restart: unless-stopped

  prometheus:
    env_file: .env
    image: prom/prometheus:latest
    container_name: rojgar-prometheus
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - rojgar-network

  grafana:
    env_file: .env
    image: grafana/grafana:latest
    container_name: rojgar-grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    ports:
      - "3002:3000"
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - rojgar-network

networks:
  rojgar-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ai_models:
  prometheus_data:
  grafana_data:

