apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawler
  namespace: rojgarsetu
  labels:
    app: crawler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crawler
  template:
    metadata:
      labels:
        app: crawler
    spec:
      containers:
      - name: crawler
        image: ghcr.io/[GITHUB_USER]/rojgarsetu/crawler:2.0.0
        ports:
        - containerPort: 8082
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: rojgarsetu-secrets
              key: database_url
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1"
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: crawler
  namespace: rojgarsetu
spec:
  selector:
    app: crawler
  ports:
  - port: 80
    targetPort: 8082
  type: ClusterIP
