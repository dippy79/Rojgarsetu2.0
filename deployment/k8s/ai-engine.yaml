apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-engine
  namespace: rojgarsetu
  labels:
    app: ai-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-engine
  template:
    metadata:
      labels:
        app: ai-engine
    spec:
      containers:
      - name: ai-engine
        image: ghcr.io/[GITHUB_USER]/rojgarsetu/ai-engine:2.0.0
        ports:
        - containerPort: 5000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: rojgarsetu-secrets
              key: database_url
        resources:
          requests:
            memory: \"512Mi\"
            cpu: \"250m\"
          limits:
            memory: \"1Gi\"
            cpu: \"500m\"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-engine
  namespace: rojgarsetu
spec:
  selector:
    app: ai-engine
  ports:
  - port: 80
    targetPort: 5000
  type: ClusterIP
