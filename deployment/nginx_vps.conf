# /etc/nginx/sites-available/rojgarsetu
# Copy to VPS: sudo cp nginx_vps.conf /etc/nginx/sites-available/rojgarsetu
# sudo ln -s /etc/nginx/sites-available/rojgarsetu /etc/nginx/sites-enabled/
# sudo nginx -t &amp;&amp; sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    server_name api.yourdomain.com;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
    
    location /health {
        access_log off;
        proxy_pass http://localhost:8080/health;
        proxy_set_header Host $host;
    }
}

# SSL: certbot --nginx -d api.yourdomain.com
# This config is certbot-compatible (listen 80 unchanged)

